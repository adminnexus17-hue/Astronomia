<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>🚀 ASTRO QUIZ | Space Challenge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0f1e, #03050b);
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, 'Inter', sans-serif;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #eef5ff;
        }

        /* container utama */
        .app-container {
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
            justify-content: center;
        }

        /* panel kiri (quiz & login) */
        .quiz-panel {
            flex: 2;
            min-width: 280px;
            background: rgba(12, 20, 35, 0.55);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            border: 1px solid rgba(80, 150, 255, 0.25);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(90, 160, 255, 0.2);
            padding: 1.5rem;
            transition: all 0.2s ease;
        }

        /* leaderboard panel */
        .leaderboard-panel {
            flex: 1.2;
            min-width: 260px;
            background: rgba(8, 14, 26, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            border: 1px solid rgba(0, 200, 255, 0.3);
            box-shadow: 0 20px 35px -10px black;
            padding: 1.2rem;
            height: fit-content;
            max-height: 85vh;
            overflow-y: auto;
        }

        /* scroll leaderboard custom */
        .leaderboard-panel::-webkit-scrollbar {
            width: 4px;
        }
        .leaderboard-panel::-webkit-scrollbar-track {
            background: #1e2a3a;
            border-radius: 10px;
        }
        .leaderboard-panel::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 10px;
        }

        /* login card */
        .login-card, .quiz-card, .result-card {
            transition: 0.25s ease;
        }

        h2 {
            font-weight: 600;
            background: linear-gradient(135deg, #c0e0ff, #a37cff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            margin-bottom: 1rem;
            font-size: 1.7rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }
        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid #2d4b8c;
            border-radius: 2rem;
            font-size: 1rem;
            color: white;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }
        .input-group input:focus {
            border-color: #7b5cff;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }
        .btn-primary {
            background: linear-gradient(95deg, #3b3bff, #b45aff);
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 3rem;
            font-weight: bold;
            font-size: 1.1rem;
            color: white;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s;
            box-shadow: 0 6px 14px rgba(0, 80, 255, 0.3);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .btn-secondary {
            background: rgba(50, 70, 120, 0.7);
            border: 1px solid #6390ff;
            color: #eef;
            padding: 10px 20px;
            border-radius: 2rem;
            cursor: pointer;
            font-weight: 500;
            transition: 0.1s linear;
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 20px 0 25px;
            line-height: 1.3;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0 28px;
        }
        .option {
            background: rgba(20, 30, 55, 0.6);
            border-radius: 60px;
            padding: 12px 18px;
            border: 1px solid #2d5590;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.1s;
        }
        .option.selected {
            background: linear-gradient(120deg, #2b3b77, #1d2c57);
            border-color: #8cb4ff;
            box-shadow: 0 0 10px #4a7eff6e;
        }
        .opt-letter {
            font-weight: bold;
            background: #0f1a2f;
            width: 38px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 40px;
            font-size: 1.2rem;
        }
        .opt-text {
            font-size: 1rem;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .progress {
            font-size: 0.9rem;
            background: #0e1625b3;
            display: inline-block;
            padding: 6px 16px;
            border-radius: 40px;
            margin-bottom: 12px;
        }

        /* leaderboard items */
        .leaderboard-title {
            font-size: 1.7rem;
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .lb-item {
            background: rgba(20, 30, 55, 0.45);
            margin: 10px 0;
            padding: 12px 16px;
            border-radius: 60px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-weight: 500;
            backdrop-filter: blur(2px);
            transition: all 0.1s;
        }
        .rank-1 {
            background: linear-gradient(135deg, #ffd966, #ffb347);
            color: #1a0f00;
            font-weight: bold;
            box-shadow: 0 0 12px #ffb347;
            animation: gentleGlow 1.8s infinite alternate;
        }
        @keyframes gentleGlow {
            0% { text-shadow: 0 0 0px #ffb347; box-shadow: 0 0 4px gold; }
            100% { text-shadow: 0 0 6px #ffb05a; box-shadow: 0 0 14px #ffc107; }
        }
        .rank-2 {
            background: linear-gradient(95deg, #1e56a0, #d048b0, #ff7890);
            background-size: 200%;
            color: white;
            border: none;
        }
        .rank-3 {
            background: #0e1b2e;
            box-shadow: 0 0 8px #9f5eff, 0 0 5px #ff3e9d;
            border: 1px solid #aa66ff;
            color: #f0eefc;
        }
        .rank-other {
            background: rgba(30, 42, 70, 0.7);
            color: #cddeff;
        }
        .lb-name {
            font-size: 0.95rem;
            max-width: 130px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .lb-score {
            font-weight: 700;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.85rem;
        }

        .score-big {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 15px 0;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        @media (max-width: 780px) {
            body { padding: 1rem; }
            .question-text { font-size: 1.2rem; }
            .option { padding: 8px 14px; }
        }
        .footer-note {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 20px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="quiz-panel" id="quizPanel">
        <!-- login state -->
        <div id="loginView">
            <div class="login-card">
                <h2>🌌 ASTRONOMI QUIZ</h2>
                <p style="margin-bottom: 20px;">Uji pengetahuan antariksa 🪐</p>
                <div class="input-group">
                    <input type="text" id="usernameInput" placeholder="Nama Astronot" autocomplete="off">
                </div>
                <div class="input-group">
                    <input type="password" id="passwordDummy" placeholder="Password (bebas, isi saja)">
                </div>
                <button class="btn-primary" id="startQuizBtn">🚀 START QUIZ</button>
                <div class="footer-note">✨ 20 soal | skor maks 100</div>
            </div>
        </div>

        <!-- quiz state (hidden initially) -->
        <div id="quizView" style="display: none;">
            <div class="quiz-card">
                <div class="flex-between">
                    <div class="progress" id="progressCounter">Soal 1 / 20</div>
                    <div style="font-weight: bold;" id="scoreIndicator">⭐ Skor: 0</div>
                </div>
                <div class="question-text" id="questionText">Memuat soal...</div>
                <div class="options-grid" id="optionsContainer"></div>
                <div class="nav-buttons">
                    <button class="btn-secondary" id="backBtn">◀ BACK</button>
                    <button class="btn-primary" id="nextBtn" style="width: auto; padding: 10px 32px;">NEXT ▶</button>
                </div>
            </div>
        </div>

        <!-- result state -->
        <div id="resultView" style="display: none;">
            <div class="result-card" style="text-align: center;">
                <h2>✨ HASIL QUIZ ✨</h2>
                <div class="score-big" id="finalScoreSpan">0</div>
                <p id="congratsMsg">Hebat! Skor tersimpan.</p>
                <button class="btn-primary" id="leaderboardRefreshBtnFromResult" style="margin-top: 20px;">🏆 Lihat Leaderboard Terbaru</button>
                <button class="btn-secondary" id="restartQuizBtn" style="margin-top: 12px;">🔄 Main Lagi</button>
            </div>
        </div>
    </div>

    <div class="leaderboard-panel" id="leaderboardPanel">
        <div class="leaderboard-title">
            🚀✨ TOP SCORE ✨🚀
        </div>
        <div id="leaderboardList">
            <div style="text-align:center; padding: 20px;">Memuat peringkat terbaik...</div>
        </div>
        <div class="footer-note" style="margin-top: 15px;">★ realtime update otomatis</div>
    </div>
</div>

<script>
    // ---------- SOAL ASTRONOMI (20 soal) ----------
    const QUESTIONS = [
        { text: "Apa planet terbesar di tata surya?", A: "Jupiter", B: "Saturnus", C: "Neptunus", D: "Uranus" },
        { text: "Benda langit yang mengorbit planet disebut?", A: "Satelit", B: "Komet", C: "Asteroid", D: "Meteor" },
        { text: "Galaksi tempat Bumi berada?", A: "Bima Sakti", B: "Andromeda", C: "Triangulum", D: "Sombrero" },
        { text: "Planet dengan cincin paling mencolok?", A: "Saturnus", B: "Jupiter", C: "Uranus", D: "Neptunus" },
        { text: "Apa nama bintang terdekat dari Bumi (selain Matahari)?", A: "Proxima Centauri", B: "Alpha Centauri A", C: "Barnard's Star", D: "Sirius" },
        { text: "Fenomena 'bintang jatuh' sebenarnya adalah?", A: "Meteor", B: "Komet", C: "Asteroid", D: "Planetesimal" },
        { text: "Planet yang dikenal sebagai 'planet merah'?", A: "Mars", B: "Venus", C: "Merkurius", D: "Yupiter" },
        { text: "Lapisan atmosfer Matahari paling luar?", A: "Korona", B: "Kromosfer", C: "Fotosfer", D: "Inti" },
        { text: "Apa nama lubang hitam supermasif di pusat Bima Sakti?", A: "Sagittarius A*", B: "M87*", C: "Cygnus X-1", D: "V404 Cygni" },
        { text: "Satelit alami Bumi?", A: "Bulan", B: "Phobos", C: "Deimos", D: "Europa" },
        { text: "Planet dengan suhu permukaan terpanas?", A: "Venus", B: "Merkurius", C: "Mars", D: "Yupiter" },
        { text: "Apa nama gerakan Bumi pada porosnya?", A: "Rotasi", B: "Revolusi", C: "Presesi", D: "Nutasi" },
        { text: "Planet katai di sabuk asteroid?", A: "Ceres", B: "Pluto", C: "Eris", D: "Makemake" },
        { text: "Awan Oort terletak di?", A: "Tepi tata surya", B: "Sabuk Kuiper", C: "Antara Mars dan Jupiter", D: "Dekat Matahari" },
        { text: "Bintang terang di langit malam (magnitudo tampak)?", A: "Sirius", B: "Canopus", C: "Rigel", D: "Vega" },
        { text: "Tahun cahaya adalah satuan?", A: "Jarak", B: "Waktu", C: "Kecepatan", D: "Massa" },
        { text: "Fase bulan saat tampak setengah lingkaran?", A: "Kuartal", B: "Sabit", C: "Purnama", D: "Baru" },
        { text: "Siapa astronom pertama yang menggunakan teleskop?", A: "Galileo Galilei", B: "Copernicus", C: "Kepler", D: "Newton" },
        { text: "Apa nama misi manusia ke Bulan pertama?", A: "Apollo 11", B: "Apollo 13", C: "Gemini 7", D: "Mercury 3" },
        { text: "Planet terdingin di tata surya?", A: "Neptunus", B: "Uranus", C: "Saturnus", D: "Pluto" }
    ];

    // scoring map: A=5, B=4, C=2, D=1
    const SCORE_MAP = { A: 5, B: 4, C: 2, D: 1 };

    // state
    let currentUser = "";
    let currentAnswers = new Array(20).fill(null); // menyimpan jawaban: 'A','B','C','D'
    let currentIndex = 0; // 0-indexed
    let quizFinished = false;

    // DOM elements
    const loginView = document.getElementById('loginView');
    const quizView = document.getElementById('quizView');
    const resultView = document.getElementById('resultView');
    const usernameInput = document.getElementById('usernameInput');
    const startBtn = document.getElementById('startQuizBtn');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const nextBtn = document.getElementById('nextBtn');
    const backBtn = document.getElementById('backBtn');
    const progressCounter = document.getElementById('progressCounter');
    const scoreIndicator = document.getElementById('scoreIndicator');
    const finalScoreSpan = document.getElementById('finalScoreSpan');
    const restartQuizBtn = document.getElementById('restartQuizBtn');
    const leaderboardRefreshBtnFromResult = document.getElementById('leaderboardRefreshBtnFromResult');

    // leaderboard container
    const leaderboardList = document.getElementById('leaderboardList');

    // Endpoint Google Apps Script
    const BACKEND_URL = "https://script.google.com/macros/s/AKfycbxaUD1wr-oUyl8V3KnqA38whkMZjbyX0R3WyMiphaWGcyNCKDdac7aP_xattDLANSmZ/exec";

    // ---------- Fungsi Backend & Leaderboard ----------
    async function fetchLeaderboardAndRender() {
        try {
            const response = await fetch(BACKEND_URL);
            const data = await response.json();
            // data diharapkan array of objects {nama, score} atau apapun. Sesuai endpoint
            let leaderboardRaw = [];
            if (Array.isArray(data)) leaderboardRaw = data;
            else if (data && data.data && Array.isArray(data.data)) leaderboardRaw = data.data;
            else if (data && typeof data === 'object') {
                // coba baca values
                const possible = Object.values(data).find(v => Array.isArray(v));
                if (possible) leaderboardRaw = possible;
                else leaderboardRaw = [];
            }
            // ensure format {name, score}
            const normalized = leaderboardRaw.map(entry => ({
                name: entry.name || entry.nama || entry.username || "Anonim",
                score: Number(entry.score || entry.Score || 0)
            }));
            // sort desc
            normalized.sort((a,b) => b.score - a.score);
            renderLeaderboardDOM(normalized);
        } catch (err) {
            console.warn("Gagal fetch leaderboard:", err);
            leaderboardList.innerHTML = `<div style="text-align:center;padding:12px;">⚠️ Gagal ambil leaderboard, coba refresh nanti</div>`;
        }
    }

    function renderLeaderboardDOM(rankedUsers) {
        if (!rankedUsers.length) {
            leaderboardList.innerHTML = `<div style="text-align:center;padding:20px;">✨ Belum ada skor ✨</div>`;
            return;
        }
        let html = "";
        rankedUsers.forEach((user, idx) => {
            let rankClass = "";
            if (idx === 0) rankClass = "rank-1";
            else if (idx === 1) rankClass = "rank-2";
            else if (idx === 2) rankClass = "rank-3";
            else rankClass = "rank-other";
            let medal = "";
            if (idx === 0) medal = "🥇 ";
            else if (idx === 1) medal = "🥈 ";
            else if (idx === 2) medal = "🥉 ";
            else medal = `${idx+1}. `;
            html += `
                <div class="lb-item ${rankClass}">
                    <span class="lb-name">${medal} ${escapeHtml(user.name)}</span>
                    <span class="lb-score">SCORE = ${user.score}</span>
                </div>
            `;
        });
        leaderboardList.innerHTML = html;
    }

    async function submitScoreToBackend(username, score) {
        try {
            const url = `${BACKEND_URL}?username=${encodeURIComponent(username)}&score=${encodeURIComponent(score)}`;
            await fetch(url, { method: 'GET', cache: 'no-cache' }); // GET based on spec
            // langsung refresh leaderboard setelah submit
            await fetchLeaderboardAndRender();
        } catch(e) { console.error("Submit score error", e); }
    }

    // helper
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    // -------------- QUIZ Logic --------------
    function calculateTotalScore() {
        let total = 0;
        for (let i=0; i<20; i++) {
            const ans = currentAnswers[i];
            if (ans && SCORE_MAP[ans]) total += SCORE_MAP[ans];
        }
        return total;
    }

    function updateScoreDisplay() {
        const currentTotal = calculateTotalScore();
        scoreIndicator.innerText = `⭐ Skor: ${currentTotal}`;
    }

    function renderCurrentQuestion() {
        const q = QUESTIONS[currentIndex];
        if (!q) return;
        questionText.innerText = q.text;
        const selectedAnswer = currentAnswers[currentIndex];
        const letters = ['A','B','C','D'];
        let optsHtml = "";
        letters.forEach(letter => {
            const optText = q[letter];
            const isSelected = (selectedAnswer === letter);
            const selectedClass = isSelected ? "selected" : "";
            optsHtml += `
                <div class="option ${selectedClass}" data-opt="${letter}">
                    <div class="opt-letter">${letter}</div>
                    <div class="opt-text">${escapeHtml(optText)}</div>
                </div>
            `;
        });
        optionsContainer.innerHTML = optsHtml;
        // attach event listeners
        document.querySelectorAll('.option').forEach(optDiv => {
            optDiv.addEventListener('click', (e) => {
                const letter = optDiv.getAttribute('data-opt');
                // update jawaban
                currentAnswers[currentIndex] = letter;
                // re-render supaya highlight berubah
                renderCurrentQuestion();
                updateScoreDisplay();
            });
        });
        progressCounter.innerText = `Soal ${currentIndex+1} / 20`;
    }

    function goNext() {
        if (currentIndex < 19) {
            currentIndex++;
            renderCurrentQuestion();
        } else {
            // selesai quiz, hitung final score lalu kirim & tampilkan hasil
            finishQuiz();
        }
    }

    function goBack() {
        if (currentIndex > 0) {
            currentIndex--;
            renderCurrentQuestion();
        }
    }

    async function finishQuiz() {
        const finalScore = calculateTotalScore();
        // Tampilkan hasil
        finalScoreSpan.innerText = finalScore;
        document.getElementById('congratsMsg').innerHTML = `Skor kamu ${finalScore} 🪐 Data dikirim ke luar angkasa!`;
        quizView.style.display = 'none';
        resultView.style.display = 'block';
        quizFinished = true;
        // kirim ke backend
        if (currentUser) {
            await submitScoreToBackend(currentUser, finalScore);
        } else {
            await fetchLeaderboardAndRender();
        }
        // auto polling ringan: setiap kali selesai quiz langsung refresh, tapi leaderboard juga akan fetch terus saat tombol refresh.
    }

    function startQuiz(username) {
        if (!username || username.trim() === "") {
            alert("Masukkan username terlebih dahulu!");
            return false;
        }
        currentUser = username.trim();
        // reset state
        currentAnswers = new Array(20).fill(null);
        currentIndex = 0;
        quizFinished = false;
        updateScoreDisplay();
        renderCurrentQuestion();
        loginView.style.display = 'none';
        quizView.style.display = 'block';
        resultView.style.display = 'none';
        return true;
    }

    function resetAndLoginAgain() {
        loginView.style.display = 'block';
        quizView.style.display = 'none';
        resultView.style.display = 'none';
        usernameInput.value = currentUser || "";
        currentUser = "";
    }

    // event polling leaderboard: auto refresh setiap 9 detik (ringan)
    let leaderboardInterval = null;
    function startLeaderboardPolling() {
        if (leaderboardInterval) clearInterval(leaderboardInterval);
        leaderboardInterval = setInterval(() => {
            fetchLeaderboardAndRender().catch(e=>console.warn);
        }, 9000);
    }

    // manual refresh di tombol result
    if (leaderboardRefreshBtnFromResult) {
        leaderboardRefreshBtnFromResult.addEventListener('click', async () => {
            await fetchLeaderboardAndRender();
        });
    }

    // Event Listeners
    startBtn.addEventListener('click', () => {
        const username = usernameInput.value.trim();
        const dummyPass = document.getElementById('passwordDummy').value;
        if (!username) {
            alert("⚠️ Nama tidak boleh kosong! Isi username dulu.");
            return;
        }
        startQuiz(username);
    });

    nextBtn.addEventListener('click', goNext);
    backBtn.addEventListener('click', goBack);
    if (restartQuizBtn) {
        restartQuizBtn.addEventListener('click', () => {
            resetAndLoginAgain();
        });
    }

    // initial load leaderboard
    (function init() {
        fetchLeaderboardAndRender();
        startLeaderboardPolling();
        // jika user selesai, tombol refresh from result juga melakukan reload & sorting.
        // submit ketika selesai sudah otomatis refresh leaderboard oleh fungsi submitScoreToBackend.
        // juga tambahan polling untuk realtime update secara otomatis.
    })();

    // bonus: jika tombol submit biasa tidak ada, tapi hasil sudah mengirim. Dan leaderboard sudah live.
    // pastikan juga saat pengguna menyelesaikan quiz, langsung refresh leaderboard (sudah di finishQuiz)
    // Perbaiki animasi dan transisi juga..
    // tambahkan styling css responsive selesai

    // Realtime safety: ketika result terbuka, dan ada skor baru dari backend, polling akan update leaderboard.
    window.addEventListener('load', () => {
        // extra memastikan eventlistener additional jika tombol next diakhir
    });
</script>
</body>
</html>
